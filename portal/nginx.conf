server {
    listen 80;
    server_name localhost;

    # Increase upload size for video/audio assets
    client_max_body_size 500M;

    # Frontend static files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass http://backend:8001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow auth headers to pass through
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header  Authorization;
        proxy_pass_header  WWW-Authenticate;
    }

    # Proxy output files
    location /output/ {
        proxy_pass http://backend:8001/output/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header  Authorization;
    }

    # Proxy voices
    location /voices/ {
        proxy_pass http://backend:8001/voices/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header  Authorization;
    }

    # Proxy assets (images/videos)
    location /assets_local/ {
        proxy_pass http://backend:8001/assets/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header  Authorization;
    }

    # Proxy SFX
    location /sfx/ {
        proxy_pass http://backend:8001/sfx/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header  Authorization;
    }
}
